# ElasticMQ — giả lập SQS cho dev local.
# Mỗi consumer một queue + một DLQ (xem docs/03_HIGH_LEVEL_ARCHITECTURE.md mục 10).
include classpath("application.conf")

queues {
  risk-events-dlq {}

  risk-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "risk-events-dlq"
      maxReceiveCount = 5
    }
  }

  notification-events-dlq {}

  notification-events {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "notification-events-dlq"
      maxReceiveCount = 5
    }
  }
}
