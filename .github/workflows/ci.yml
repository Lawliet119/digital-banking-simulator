# CI cho mọi PR và mọi lần push vào main (DBS-35). Cách đọc kết quả: CONTRIBUTING.md mục 4b.
#
# TÊN JOB LÀ HỢP ĐỒNG. Required status checks của `main` (DBS-37) khớp theo tên `lint`, `typecheck`,
# `unit`, `e2e`, `db`, `build`. Đổi tên một job mà không đổi ruleset cùng lúc thì mọi PR treo ở
# "Expected" vĩnh viễn. Vì cùng lý do không đặt `paths:` ở trigger, và workflow khác không được đặt
# job trùng một trong sáu tên này.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # PR: một nhóm theo ref, commit mới hủy lần chạy cũ. push: mỗi lần một nhóm riêng (run_id), vì một
  # lần chạy đang chờ trong nhóm chung vẫn bị lần mới đè dù cancel-in-progress là false, và commit
  # merge nằm giữa sẽ mất kết quả.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint:check

  typecheck:
    name: typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node --test ../load-tests/fraud-dataset/generate.test.mjs ../load-tests/fraud-dataset/inspect-fraud.test.mjs ../load-tests/fraud-dataset/generate-fraud.test.mjs ../load-tests/fraud-dataset/split.test.mjs

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    # Allows a cold Testcontainers image pull; the 10–12 minute CI target is measured separately.
    # jest-services.js tự ghi ngân sách tệ nhất 1.080.000ms (~18 phút) cho suite ElasticMQ (DBS-77)
    # chạy sau test:e2e và bước Testcontainers PostgreSQL; bước Redis (DBS-76) cộng thêm cold image
    # pull Valkey + 10 lần timeout 50ms + chờ breaker reset 5s + container startup. 15 phút cũ
    # không đủ chứa cả bốn bước, nên nâng lên có biên an toàn.
    timeout-minutes: 35
    # app-guard.e2e-spec.ts (DBS-50) boots the real AppModule, và DatabaseModule luôn mở kết nối
    # Postgres thật lúc app.init() bất kể route nào được gọi — nên job này cần service Postgres như
    # job `db`, dù phần lớn test:e2e khác fake DataSource. Bước Testcontainers dưới đây tự gỡ
    # DATABASE_URL riêng cho lệnh của nó (DBS-41) để buộc tạo container PostgreSQL 17 mới.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d banking"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/banking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:e2e
      # Run these real-DB suites with DATABASE_URL removed: globalSetup starts PostgreSQL 17.
      # DBS-65 also starts a private Valkey container and exercises the full HTTP/JWT money flow.
      - name: Testcontainers PostgreSQL 17 (sample, migrations and DBS-65 money flow)
        shell: bash
        run: |
          env -u DATABASE_URL npm run test:db -- --runInBand --runTestsByPath \
            test/db/testcontainers-sample.db-spec.ts \
            test/db/migration-revert.db-spec.ts \
            test/db/money-flow.db-spec.ts
      - name: Isolated service containers Valkey + ElasticMQ (DBS-40)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/testcontainers.services-spec.ts
      - name: SQS adapter on ElasticMQ Testcontainers (DBS-77)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/sqs-adapter.services-spec.ts
      - name: Outbox relay and notification consumer on PostgreSQL + ElasticMQ
        run: npm run test:services -- --runInBand --runTestsByPath test/services/outbox-relay.services-spec.ts
      - name: Outbox relay under failure (kill, failing events, time bounds)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/outbox-relay-faults.services-spec.ts
      - name: ConsumerBase on PostgreSQL + ElasticMQ (DBS-101)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/consumer-base.services-spec.ts
      - name: Notification consumer review focus - duplicate, broken, reordered (DBS-104)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/notification-consumer-review.services-spec.ts
      - name: correlationId across API, outbox, SQS and consumer (DBS-134)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/correlation-chain.services-spec.ts
      - name: Auditor traces one transfer by its correlationId end to end (DBS-135)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/audit-trace.services-spec.ts
      - name: HTTP, outbox-age and counter metrics as EMF lines (DBS-144)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/metrics-chain.services-spec.ts
      - name: Online feature provider, authoritative PostgreSQL aggregates (DBS-109)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/online-feature-provider.services-spec.ts
      - name: Online and Offline FeatureProvider parity (DBS-162)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/feature-provider-parity.services-spec.ts
      - name: Rule set repository, cached versions and PostgreSQL fallback (DBS-110)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/rule-set-repository.services-spec.ts test/services/risk-version-cache.services-spec.ts
      - name: Redis adapter latency, outage and recovery (DBS-76)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/redis-adapter.services-spec.ts
      - name: Readiness with real PostgreSQL and Valkey failures (DBS-78)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/health-readiness.services-spec.ts
      - name: Rate limit with real PostgreSQL and Valkey, slow and dead Redis (DBS-89)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/rate-limit.services-spec.ts
      - name: Review Focus 5 - Transfer under slow and dead Redis (DBS-100)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/redis-slow-transfer.services-spec.ts
      - name: Risk consumer, transfer to flag through the real relay and consumer loops (DBS-111)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/risk-scoring.services-spec.ts
      - name: SQL-authoritative fraud features and delivery-order regressions
        run: npm run test:services -- --runInBand --runTestsByPath test/services/risk-feature-order.services-spec.ts
      - name: Worker stop, crash and restart lose no flag (DBS-124)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/worker-recovery.services-spec.ts
      - name: Failing notification dead-letters alone, broken messages, redrive (DBS-125)
        run: npm run test:services -- --runInBand --runTestsByPath test/services/dlq-isolation.services-spec.ts

  db:
    name: db
    runs-on: ubuntu-24.04
    # Trọn bộ DB và thiết lập service cần dư địa; không hủy giữa chừng sau khi thêm migration.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: banking
        ports:
          - 5432:5432
        # -h 127.0.0.1: pg_isready mặc định nối qua Unix socket, mà server tạm của bước khởi tạo
        # image chỉ nghe socket, nên không có -h thì "sẵn sàng" có thể đến trước khi server thật nghe
        # TCP. Interval mặc định là 30 giây nên hạ xuống.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d banking"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/banking
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # TC-21-24 dùng `session_replication_role = replica` nên role phải là superuser, và ADR-02 yêu
      # cầu timezone UTC. Không dựa vào mặc định của image: sai thì job đỏ ngay ở đây, với lý do rõ.
      - name: Kiểm Postgres (superuser, UTC)
        shell: bash
        run: |
          superuser=$(psql "$DATABASE_URL" -tAc "select rolsuper from pg_roles where rolname = current_user")
          timezone=$(psql "$DATABASE_URL" -tAc "show timezone")
          echo "rolsuper=$superuser timezone=$timezone"
          test "$superuser" = t
          case "$timezone" in UTC | Etc/UTC) ;; *) echo "timezone phải là UTC"; exit 1 ;; esac
      - run: npm run test:db

  build:
    name: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run build

  # Hai job quét của DBS-155. Chạy ở gốc repo (khác sáu job trên, mặc định working-directory là backend).
  # Chưa thuộc "sáu tên hợp đồng"; chỉ chặn merge khi chủ repo thêm vào ruleset (BL-035, BL-012).
  # Công cụ chạy bằng image chính thức ghim digest; cách dùng và cờ ở .github/scripts/run-trivy.sh và
  # run-gitleaks.sh, được .github/scripts/check-image-workflow.py kiểm trên mọi PR.
  image-scan:
    name: image-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    env:
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.76.1@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --provenance=false --sbom=false -t dbs-api:scan backend
      - name: Trivy (lỗ hổng HIGH/CRITICAL có bản sửa, secret trong image)
        run: bash .github/scripts/run-trivy.sh dbs-api:scan

  secret-scan:
    name: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .
    env:
      GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Kiểm tĩnh workflow và tệp ngoại lệ
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pyyaml==6.0.2
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/check-image-workflow.py
          "$RUNNER_TEMP/venv/bin/python" .github/scripts/check-scan-exceptions.py
      - name: gitleaks trên lịch sử tới HEAD
        run: |
          export GITLEAKS_RUN="docker run --rm --user $(id -u):$(id -g) -v $PWD:/repo:ro $GITLEAKS_IMAGE"
          export SCAN_PATH=/repo CONFIG=/repo/.gitleaks.toml IGNORE=/repo/.gitleaksignore LOG="$RUNNER_TEMP/gitleaks.log"
          bash .github/scripts/run-gitleaks.sh

  # Hai job của BL-028 / BL-101 / BL-253: Terraform và test script hạ tầng. Chạy ở gốc repo (mặc định
  # working-directory là backend). Chưa thuộc "sáu tên hợp đồng"; chỉ chặn merge khi chủ repo thêm vào
  # ruleset (BL-012).
  # CI không có thông tin xác thực AWS và không cần: `-backend=false` bỏ backend S3, còn `terraform test`
  # dùng mock_provider/override_data (kể cả data.terraform_remote_state.base của session) nên không gọi
  # AWS. Ba thư mục gồm cả tests/dashboard.tftest.hcl của DBS-145. Lock file đã commit giữ nguyên bản
  # provider; `-lockfile=readonly` làm `init` đỏ thay vì âm thầm sửa chúng.
  terraform:
    name: terraform
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    env:
      TF_IN_AUTOMATION: "true"
      TF_INPUT: "0"
      # Không có AWS thật: không để provider thử gọi IMDS rồi chờ hết hạn.
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # required_version của các versions.tf là ">= 1.11"; ghim đúng bản đã chạy thử để CI không đổi theo.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.16.6"
          terraform_wrapper: false
      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive -diff infra/terraform
      - name: init, validate, test (bootstrap, envs/dev/base, envs/dev/session)
        shell: bash
        run: |
          set -euo pipefail
          for dir in infra/terraform/bootstrap infra/terraform/envs/dev/base infra/terraform/envs/dev/session; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false -lockfile=readonly
            terraform -chdir="$dir" validate
            terraform -chdir="$dir" test
            echo "::endgroup::"
          done

  script-tests:
    name: script-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Test dùng `aws`, `curl`, `gh` giả đặt trước trên PATH, nên chỉ chạy trên Linux (PATH tách bằng
      # `:`). Cần bash, python3, curl, jq (có sẵn trên ubuntu-24.04) và PyYAML cho
      # test_check_image_workflow.py. Chạy hết rồi mới báo, để một test đỏ không che các test khác.
      - name: Test script hạ tầng và script CI (BL-101, BL-253)
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install pyyaml==6.0.2
          failed=0
          for t in infra/scripts/tests/test_*.py .github/scripts/tests/test_*.py; do
            echo "::group::$t"
            "$RUNNER_TEMP/venv/bin/python" "$t" || { echo "::error::$t đỏ"; failed=1; }
            echo "::endgroup::"
          done
          exit "$failed"
